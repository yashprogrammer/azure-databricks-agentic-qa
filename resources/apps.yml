# Databricks App resource: deploys the WHOLE repo (not just app/), because
# streamlit_app.py imports the full `policypilot` package (agent, retrieval, ingestion).
# app.yaml (repo root) has the run command + env vars; requirements.txt (repo root) has
# the pip dependencies. The App no longer binds the Groq key directly — it calls the
# policypilot-groq-gateway serving endpoint (resources/serving_endpoint.yml) instead, which
# holds the Key Vault-backed secret itself. The App's own service principal needs CAN_QUERY
# on that endpoint — see docs/DEPLOYMENT_GUIDE.md.

resources:
  apps:
    policypilot_app:
      name: policypilot
      description: Governed regulatory/policy Q&A copilot
      source_code_path: ..
