# Databricks App resource: deploys the WHOLE repo (not just app/), because
# streamlit_app.py imports the full `policypilot` package (agent, retrieval, ingestion).
# app.yaml (repo root) has the run command + env vars; requirements.txt (repo root) has
# the pip dependencies. The App no longer binds the Groq key directly — it calls the Unity
# Gateway model service in resources/ai_gateway.yml, whose provider service holds the key.
# The App's own service principal needs EXECUTE on that model service — see
# docs/DEPLOYMENT_GUIDE.md 10.4.

resources:
  apps:
    policypilot_app:
      name: policypilot
      description: Governed regulatory/policy Q&A copilot
      source_code_path: ..
