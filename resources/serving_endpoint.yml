# Unity AI Gateway External Model endpoint: proxies to Groq's OpenAI-compatible API
# (https://api.groq.com/openai/v1) so the deployed App gets PII/safety guardrails without
# switching LLM providers (see docs/UPGRADE_PLAN.md items 1+3). The App's own service
# principal must be granted CAN_QUERY on this endpoint after deploy — see
# docs/DEPLOYMENT_GUIDE.md. The two custom guardrails (off-topic, investment-advice) have no
# declarative Terraform/bundle field yet — configured manually in the Serving UI, also
# documented there.

resources:
  model_serving_endpoints:
    policypilot_groq_gateway:
      name: policypilot-groq-gateway
      config:
        served_entities:
          - name: groq-oss-120b
            external_model:
              provider: openai
              name: openai/gpt-oss-120b
              task: llm/v1/chat
              openai_config:
                openai_api_base: https://api.groq.com/openai/v1
                openai_api_key: "{{secrets/topsecretScopee/groq-api-key}}"
      ai_gateway:
        usage_tracking_config:
          enabled: true
        guardrails:
          input:
            safety: true
            pii:
              behavior: BLOCK
          output:
            safety: true
            pii:
              behavior: BLOCK
