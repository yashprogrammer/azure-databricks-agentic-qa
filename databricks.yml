# Databricks Asset Bundle for PolicyPilot.
#
# `dev` target is real and deployable (workspace, Unity Catalog, Key Vault, GitHub OIDC
# all provisioned — see README "Status"). `staging`/`prod` hosts and run-as service
# principals are still placeholders for a future milestone.

bundle:
  name: policypilot

include:
  - resources/apps.yml
  # resources/jobs.yml is intentionally excluded: it still has placeholder values
  # (cluster ID, alert email) since the ingestion job isn't wired up yet — data was
  # seeded manually via notebooks/seed_chunks_table.py instead. Re-add once filled in.

variables:
  catalog:
    description: Unity Catalog catalog name for this environment
    default: policypilot

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405615537260067.7.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: policypilot_dev

  staging:
    mode: production
    workspace:
      host: <REPLACE_WITH_STAGING_WORKSPACE_URL>
      root_path: /Bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: policypilot_staging
    run_as:
      service_principal_name: <REPLACE_WITH_STAGING_RUN_AS_SP>

  prod:
    mode: production
    workspace:
      host: <REPLACE_WITH_PROD_WORKSPACE_URL>
      root_path: /Bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: policypilot_prod
    run_as:
      service_principal_name: <REPLACE_WITH_PROD_RUN_AS_SP>
