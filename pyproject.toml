[project]
name = "policypilot"
version = "0.1.0"
description = "Governed regulatory/policy Q&A copilot — Databricks + Azure agentic AI portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.13.0",
    "langgraph>=0.2.60",
    "mlflow>=2.18.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.36.0",
    "databricks-vectorsearch>=0.40",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policypilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
