name: CD (Databricks Asset Bundle)

# Manual dispatch. Required environment secrets (per target):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (federated identity, no PAT)
#   DATABRICKS_HOST
#   KEY_VAULT_NAME — vault holding `groq-api-key`; the OIDC app needs Get on its secrets.
#     The key is read at deploy time and passed to the bundle as BUNDLE_VAR_groq_api_key
#     (resources/ai_gateway.yml), so it's never stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy (dev/staging/prod)"
        required: true
        default: dev

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read Groq API key from Key Vault
        run: |
          key=$(az keyvault secret show --vault-name "${{ secrets.KEY_VAULT_NAME }}" \
            --name groq-api-key --query value -o tsv)
          [ -n "$key" ] || { echo "groq-api-key is empty in Key Vault"; exit 1; }
          echo "::add-mask::$key"
          echo "BUNDLE_VAR_groq_api_key=$key" >> "$GITHUB_ENV"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t ${{ inputs.target }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}

      - name: Deploy bundle
        run: databricks bundle deploy -t ${{ inputs.target }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
